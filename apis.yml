  pass: local-v1
  note: >-
    Contract discovery beat a prior "no API" finding. Two OpenAPI 3.0.0 documents (81
    operations) are published on Fintary's own API host, embedded in the __NEXT_DATA__ of
    api.fintary.com/openapi-doc and /api-doc, which is why every conventional
    /openapi.json probe returns 404. Both were confirmed live (401 on real routes, 404 on a
    control path).
