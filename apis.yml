- name: Fintary AMS API
  description: >-
    Agency Management System REST API covering the policy, customer and agent record
    core — policy detail, status changes, teams, tasks, commission breakdown and the
    two-phase document repository upload; customer CRUD, summaries and bulk update;
    agent CRUD, contracts, hierarchy and full upline/downline tree; task management and
    escalation; custom-field and status configuration; and a page-config/capabilities
    registry that publishes bindable fields, widget vocabulary and an endpoint allowlist
    for AI and wire clients. Sixty operations under `/api/ams/` on api.fintary.com,
    authenticated with an HTTP bearer token.
  humanURL: https://api.fintary.com/api-doc
