apis:
- name: Fintary Open API
  description: >-
    Customer-facing REST API over Fintary's commission and distribution data — list, create
    and update agents; assign and remove uplines; read an agent's commissions, payouts,
    policies and dashboard snapshot; query published analytics reports, datasets and
    dashboard widgets; pull commission report data; and upload or convert documents.
    Authenticated with an `x-api-key` header API key or an HTTP bearer token. Twenty-one
    operations under the `/openapi/` path prefix on api.fintary.com.
  humanURL: https://api.fintary.com/openapi-doc
  baseURL: https://api.fintary.com
