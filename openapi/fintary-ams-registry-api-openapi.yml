openapi: 3.2.0
info:
  title: Fintary AMS API documentation AMS - Registry API
  version: '1.0'
security:
- BearerAuth: []
tags:
- name: AMS - Registry
paths:
  /api/ams/registry/capabilities:
    get:
      summary: Get the AI/wire manifest (bindable fields, widget vocabulary, endpoint…
      tags:
      - AMS - Registry
      parameters:
      - name: entity
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '304':
          description: Not Modified
      operationId: getApiAmsRegistryCapabilities
      x-operation-id-source: derived
  /api/ams/registry/page-config-default:
    put:
      summary: Make one of the calling account's saved page-config variants its active default
      tags:
      - AMS - Registry
      parameters:
      - name: entity
        in: query
        required: true
        schema:
          type: string
      requestBody:
        required: true
      responses:
        '200':
          description: Success
      operationId: putApiAmsRegistryPageConfigDefault
      x-operation-id-source: derived
  /api/ams/registry/page-config-save:
    put:
      summary: Save a named page-config variant for the calling account
      tags:
      - AMS - Registry
      parameters:
      - name: entity
        in: query
        required: true
        schema:
          type: string
      requestBody:
        required: true
      responses:
        '200':
          description: Success
      operationId: putApiAmsRegistryPageConfigSave
      x-operation-id-source: derived
  /api/ams/registry/page-config:
    get:
      summary: Get the wire page config for an AMS entity
      tags:
      - AMS - Registry
      parameters:
      - name: entity
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '304':
          description: Not Modified
      operationId: getApiAmsRegistryPageConfig
      x-operation-id-source: derived
  /api/ams/registry/page-configs:
    get:
      summary: List the calling account's saved page-config variants for an AMS entity…
      tags:
      - AMS - Registry
      parameters:
      - name: entity
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
      operationId: getApiAmsRegistryPageConfigs
      x-operation-id-source: derived
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: string
