        status:
          type: string
        level:
          type: string
        type:
          type: string
        companyName:
          type: string
        geoState:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        userStrId:
          type: string
        hierarchy:
          type: array
          items:
            type: object
            properties:
              parentContactStrId:
                type: string
                minLength: 1
              relationship:
                type: string
            required:
            - parentContactStrId
        commissionProfiles:
