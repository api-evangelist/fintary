openapi: 3.2.0
info:
  title: Fintary AMS API documentation AMS - Agents API
  version: '1.0'
  description: Agent management endpoints
servers:
- url: https://api.fintary.com
  description: Base URL declared by the provider in apis.yml (roadmap#122).
security:
- BearerAuth: []
tags:
- name: AMS - Agents
  description: Agent management endpoints
paths:
  /api/ams/agents/{strId}:
    get:
      summary: Agent detail
      tags:
      - AMS - Agents
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AgentDetailResponseSchema'
        '404':
          description: Not found
    patch:
      summary: Update an agent
      tags:
      - AMS - Agents
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmsUpdateAgentSchema'
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AgentDetailResponseSchema'
        '404':
          description: Not found
    delete:
      summary: Delete an agent
      tags:
      - AMS - Agents
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true
        '404':
          description: Not found
  /api/ams/agents/{strId}/contracts/{contractId}:
    get:
      summary: Contract detail
      tags:
      - AMS - Agents
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      - name: contractId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContractResponseSchema'
        '404':
          description: Not found
    patch:
      summary: Update a contract
      tags:
      - AMS - Agents
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      - name: contractId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmsUpdateContractSchema'
      responses:
        '200':
          description: Contract updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContractResponseSchema'
        '404':
          description: Not found
    delete:
      summary: Delete a contract
      tags:
      - AMS - Agents
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      - name: contractId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Contract deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true
        '404':
          description: Not found
  /api/ams/agents/{strId}/contracts:
    get:
      summary: List agent contracts
      tags:
      - AMS - Agents
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContractListResponseSchema'
        '404':
          description: Not found
    post:
      summary: Create agent contract
      tags:
      - AMS - Agents
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmsCreateContractSchema'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContractResponseSchema'
        '404':
          description: Not found
  /api/ams/agents/{strId}/hierarchy:
    get:
      summary: Get agent hierarchy tree (uplines and downlines)
      tags:
      - AMS - Agents
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AgentHierarchyResponseSchema'
        '404':
          description: Not found
  /api/ams/agents/{strId}/tree:
    get:
      summary: Get the full hierarchy tree for an agent (ancestors + descendants)
      tags:
      - AMS - Agents
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      - name: query
        in: query
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/AmsAgentTreeQuerySchema'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AgentTreeResponseSchema'
        '404':
          description: Not found
  /api/ams/agents/bulk-update:
    patch:
      summary: Bulk update agents
      tags:
      - AMS - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmsBulkUpdateAgentsBodySchema'
      responses:
        '200':
          description: Bulk update results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmsBulkUpdateResponseSchema'
  /api/ams/agents:
    get:
      summary: List agents
      tags:
      - AMS - Agents
      parameters:
      - name: query
        in: query
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/AmsAgentListQuerySchema'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponseSchema'
    post:
      summary: Create an agent
      tags:
      - AMS - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmsCreateAgentSchema'
      responses:
        '200':
          description: Agent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AgentDetailResponseSchema'
  /api/ams/agents/summary:
    get:
      summary: Agent summary
      tags:
      - AMS - Agents
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AgentSummaryResponseSchema'
components:
  schemas:
    AgentTreeNodeSchema:
      type: object
      properties:
        strId:
          type: string
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        agentCode:
          type: string
        level:
          type: string
        splitPercentage:
          type: number
        depth:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/AgentTreeNodeSchema'
        parentContactId:
          type: string
      required:
      - strId
      - depth
      - children
    AmsCreateAgentSchema:
