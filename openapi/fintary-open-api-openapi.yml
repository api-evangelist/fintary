  /openapi/analytics/reports/{id}:
    get:
      operationId: analytics.getReportData
      summary: Fetch data for a specific analytics report
      description: 'Fetches a published analytics report by id. Returns report data rows by default; pass `metadata_only=true`
        for the report configuration only, or `csv_output=true` (optionally with `background_task=true`) to export as CSV.
        Admin/Account-Admin callers may scope to another account/contact via `account_id`/`contact_id`.

        '
      tags:
      - Analytics
      parameters:
      - name: id
        in: path
        required: true
        description: Report identifier. Pass the string ID (`str_id`) of the report. Integer IDs are accepted for legacy compatibility
          but deprecated.
        schema:
          type: string
      - name: start_date
        in: query
        required: false
        description: Start date (inclusive) in YYYY-MM-DD for report data query.
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        description: End date (inclusive) in YYYY-MM-DD for report data query.
        schema:
          type: string
          format: date
      - name: page_size
        in: query
        required: false
        description: Page size for report data query.
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: Zero-based page index for report data query.
        schema:
          type: integer
      - name: account_id
        in: query
        required: false
        description: Account ID override (Fintary Admin or Account Admin). Account admins are restricted to their own account.
        schema:
          type: string
      - name: contact_id
        in: query
        required: false
        description: Contact ID to fetch report data for (Fintary Admin or Account Admin). Must be used with account_id.
        schema:
          type: integer
      - name: csv_output
        in: query
        required: false
        description: When true, returns report data as CSV.
        schema:
          type: boolean
      - name: filter_model
        in: query
        required: false
        description: AgGrid filter model JSON string for server-side filtering.
        schema:
          type: string
      - name: order_by
        in: query
        required: false
        description: Sort column name. Repeat the parameter to apply multi-column sorting, for example `?order_by=column_a&order_by=column_b`.
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        style: form
        explode: true
      - name: sort
        in: query
        required: false
        description: Sort direction aligned with `order_by`. Repeat the parameter to match multi-column sorting, for example
          `?sort=asc&sort=desc`.
        schema:
          oneOf:
          - type: string
            enum:
            - asc
            - desc
          - type: array
            items:
              type: string
              enum:
              - asc
              - desc
        style: form
        explode: true
      - name: background_task
        in: query
        required: false
        description: When true (requires csv_output=true), queues the export as a background task. Returns `{ taskId, statusUrl
          }` instead of streaming CSV. Poll `GET /openapi/analytics/tasks/{taskId}` for status and the signed download URL.
        schema:
          type: boolean
      - name: email_account_admins
        in: query
        required: false
        description: When true (requires background_task=true), emails account admins when the export completes.
        schema:
          type: boolean
      - name: metadata_only
        in: query
        required: false
        description: When true, returns only the report configuration (no data rows). See response shape (2).
        schema:
          type: boolean
      - name: '{column}_start'
        in: query
        required: false
        description: 'Dynamic per-column date-range lower bound (inclusive). Replace `{column}` with any filterable date column
          (e.g. `effective_date_start`); pair it with the matching `{column}_end`. Parsed by `parseDateColumnRangesFromQuery`.
          Distinct from the report-wide `start_date`/`end_date`.

          '
        schema:
          type: string
          format: date
      - name: '{column}_end'
        in: query
        required: false
        description: 'Dynamic per-column date-range upper bound (inclusive). Pairs with `{column}_start` (e.g. `effective_date_end`).

          '
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 'Several response shapes depending on parameters: (1) Default — returns report data with rows, pageRowCount,
            rowCount, and page. A date range (or dynamic `{column}_start`/`{column}_end`) narrows the data but is not required.
            (2) metadata_only=true — returns report configuration only (analytic_report_access with selected_columns, group_by_columns,
            filters, roles, users). (3) csv_output=true — streams CSV directly. (4) csv_output=true&background_task=true —
            returns `{ taskId: string, statusUrl: string }`. Poll GET /openapi/analytics/tasks/{taskId} for status.

            '
        '401':
          description: Unauthorized
        '404':
          description: Report not found
        '500':
          description: Internal server error
  /openapi/analytics/reports:
    get:
      operationId: analytics.listReports
      summary: List published analytics reports
      description: 'Returns published analytics report definitions visible to the authenticated principal. Each item represents
        one **report access record** (not the underlying template) and includes resolved dataset column metadata.

        Use the `str_id` from a list item as `{id}` in `GET /openapi/analytics/reports/{id}` to fetch report data or export
        CSV.

        **Admin overrides:** Fintary Admins and Account Admins may pass `account_id` and `contact_id` together to list reports
        as if they were that contact''s user. `contact_id` alone has no effect; `account_id` alone has no effect. Account
        admins are restricted to their own `account_id`.

        '
      tags:
      - Analytics
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: account_id
        in: query
        required: false
        description: 'Account override (Fintary Admin or Account Admin). Must be used with `contact_id`. Account admins may
          only query their own account.

          '
        schema:
          type: string
          example: acct_7f3c2b1a
      - name: contact_id
        in: query
        required: false
        description: 'Contact override (Fintary Admin or Account Admin). Must be used with `account_id`. Resolves the contact''s
          user and role for access checks.

          '
        schema:
          type: integer
          minimum: 1
          example: 12345
      responses:
        '200':
          description: Published analytics reports for the resolved principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReportsListResponseSchema'
              examples:
                withReports:
                  summary: One published report
                  value:
                  - id: 42
                    str_id: rpt_abc123xyz
                    name: Agency receivables by policy
                    principal_type: account
                    account_id: acct_7f3c2b1a
                    selected_columns:
                    - policy_number
                    - premium_amount
                    - effective_date
                    group_by_columns: []
                    column_order:
                    - policy_number
                    - premium_amount
                    columns:
                    - name: policy_number
                      type: STRING
                      description: Unique policy number assigned by the carrier
                    - name: premium_amount
                      type: FLOAT
                      description: Annualized premium amount for the policy
                    - name: effective_date
                      type: DATE
                      description: Date the policy became effective
                    measures: []
                    column_header_names: null
                    output_columns:
                    - policy_number
                    - premium_amount
                    - effective_date
                    date_key: effective_date
                    dataset_description: Receivables aggregated at the policy level
                    updated_at: '2026-04-06T18:00:00.000Z'
                    dataset_id: fintary-prod.analytics_reports.agency_receivables_by_policy
                    state: active
                    published: true
                    description: null
                    filters: []
                    created_at: '2026-01-15T12:30:00.000Z'
                empty:
                  summary: No visible published reports
                  value: []
        '401':
          description: 'Missing or invalid authentication, invalid role context, or unauthorized account override. Middleware
            auth failures return the standard response envelope; the handler returns `{ error }` for an unauthorized account
            override.

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/OpenAPIResponseSchema'
                - $ref: '#/components/schemas/OpenApiSimpleErrorResponseSchema'
              examples:
                unauthorizedAccount:
                  summary: Account admin querying another account
                  value:
                    error: Account admins can only query their own account
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/OpenAPIResponseSchema'
                - $ref: '#/components/schemas/OpenApiSimpleErrorResponseSchema'
              examples:
                serverError:
                  value:
                    error: Internal server error
  /openapi/analytics/tasks/{taskId}:
    get:
      operationId: analytics.getExportTaskStatus
      summary: Get analytics export task status
      description: 'Poll the status of a background analytics CSV export task. Create a task by calling `GET /openapi/analytics/reports/{id}`
        with `csv_output=true&background_task=true`. The `statusUrl` in that response points here.

        Poll until `status` is `completed` or `error`. On completion, `result.downloadUrl` is a signed GCS URL valid for 24
        hours.

        '
      tags:
      - Analytics
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: taskId
        in: path
        required: true
        description: Task ID returned by the background export request.
        schema:
          type: string
          example: pz9BqB8PhZmrzsDn3AYFN
      responses:
        '200':
          description: Task record
          content:
            application/json:
              schema:
                type: object
                required:
                - taskId
                - status
                - type
                - createdAt
                - updatedAt
                - duration
                - result
                - error
                properties:
                  taskId:
                    type: string
                    example: pz9BqB8PhZmrzsDn3AYFN
                  status:
                    type: string
                    enum:
                    - pending
                    - processing
                    - completed
                    - error
                    example: completed
                  type:
                    type: string
                    example: analytics_export
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  duration:
                    type: integer
                    nullable: true
                    description: Elapsed processing time in milliseconds. Null until complete.
                    example: 45213
                  result:
                    type: object
                    nullable: true
                    description: Populated when status is `completed`.
                    properties:
                      fileName:
                        type: string
                        example: my-dataset-2026-04-06T18-00-00-abc123.csv
                      downloadUrl:
                        type: string
                        description: Signed GCS URL valid for 24 hours.
                        example: https://storage.googleapis.com/...
                      completedAt:
                        type: string
                        format: date-time
                  error:
                    type: string
                    nullable: true
                    description: Error message when status is `error`. Null otherwise.
                    example: null
              examples:
                pending:
                  summary: Task still processing
                  value:
                    taskId: pz9BqB8PhZmrzsDn3AYFN
                    status: pending
                    type: analytics_export
                    createdAt: '2026-04-06T18:00:00.000Z'
                    updatedAt: '2026-04-06T18:00:01.000Z'
                    duration: null
                    result: null
                    error: null
                completed:
                  summary: Task completed with download URL
                  value:
                    taskId: pz9BqB8PhZmrzsDn3AYFN
                    status: completed
                    type: analytics_export
                    createdAt: '2026-04-06T18:00:00.000Z'
                    updatedAt: '2026-04-06T18:00:45.000Z'
                    duration: 45213
                    result:
                      fileName: my-dataset-2026-04-06T18-00-00-abc123.csv
                      downloadUrl: https://storage.googleapis.com/fintary-dev.appspot.com/exports/...
                      completedAt: '2026-04-06T18:00:45.000Z'
                    error: null
                error:
                  summary: Task failed
                  value:
                    taskId: pz9BqB8PhZmrzsDn3AYFN
                    status: error
                    type: analytics_export
                    createdAt: '2026-04-06T18:00:00.000Z'
                    updatedAt: '2026-04-06T18:00:10.000Z'
                    duration: 10032
                    result: null
                    error: 'Failed to stream CSV: dataset not found'
        '401':
          description: Missing or invalid authentication
        '404':
          description: Task not found or belongs to a different account
        '500':
          description: Internal server error
