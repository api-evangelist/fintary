  /openapi/documents/convert-html-to-pdf:
    post:
      operationId: documents.convertHtmlToPdf
      summary: Convert HTML to PDF
      description: 'Renders an uploaded HTML document (with optional referenced assets) to a PDF via the Fintary file-conversion
        service. Multipart upload; the request and the generated PDF are each capped at 32 MB. Requires the FFC feature flag
        to be enabled for the account (otherwise 403). Optionally set the `x-output-filename` header (must match `*.pdf`)
        to name the downloaded file; it falls back to `converted.pdf`.

        '
      tags:
      - Documents
      parameters:
      - name: x-output-filename
        in: header
        required: false
        description: Desired output filename. Must match `*.pdf`, else `converted.pdf` is used.
        schema:
          type: string
          example: statement.pdf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConvertHtmlToPdfRequest'
      responses:
        '200':
          description: The generated PDF document (binary).
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Missing `html_content`, or invalid `rendering_options` JSON/values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAPIResponseSchema'
        '403':
          description: The file-conversion feature is not enabled for the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAPIResponseSchema'
        '413':
          description: The request payload or generated PDF exceeds the 32 MB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAPIResponseSchema'
        '500':
          description: Conversion failed due to an upstream file-conversion error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAPIResponseSchema'
