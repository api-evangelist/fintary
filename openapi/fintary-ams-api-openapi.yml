          nullable: true
        email:
          type: string
          nullable: true
          format: email
        phone:
          type: string
          nullable: true
        dob:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
          enum:
          - male
          - female
          - null
        type:
          type: string
          nullable: true
          enum:
          - individual
          - group
          - null
        status:
          type: string
          nullable: true
        parentId:
          type: integer
          nullable: true
        acquisitionChannel:
          type: string
          nullable: true
        primaryAddressStrId:
          type: string
          nullable: true
    AmsBulkUpdateCustomersBodySchema:
      type: object
      properties:
        strIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        data:
          $ref: '#/components/schemas/AmsBulkUpdateCustomerDataSchema'
      required:
      - strIds
      - data
    AmsBulkUpdatePoliciesBodySchema:
      type: object
      properties:
        strIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        data:
          $ref: '#/components/schemas/AmsBulkUpdatePolicyDataSchema'
      required:
      - strIds
      - data
    AmsBulkUpdatePolicyDataSchema:
      type: object
