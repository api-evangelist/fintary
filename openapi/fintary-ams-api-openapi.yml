        agentCode:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
        policyCount:
          type: integer
        customerCount:
          type: integer
        companyName:
          type: string
          nullable: true
        geoState:
          type: string
          nullable: true
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
        middleName:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        birthday:
          type: string
          nullable: true
        phoneType:
          type: string
          nullable: true
        phone2:
          type: string
          nullable: true
        phone2Type:
          type: string
          nullable: true
        externalId:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        payableStatus:
          type: string
          nullable: true
        payoutLevel:
          type: string
          nullable: true
        brokerCommPayTo:
          type: string
          nullable: true
        gaFieldRep:
          type: string
          nullable: true
        gaRepresentative:
          type: string
          nullable: true
        qbVendor:
          type: string
