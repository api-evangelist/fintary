      - active
      - inactive
    AmsCreateAgentSchema:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        agentCode:
          type: string
        status:
          type: string
        level:
          type: string
        type:
          type: string
        companyName:
          type: string
        geoState:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        userStrId:
          type: string
        hierarchy:
          type: array
          items:
            type: object
            properties:
              parentContactStrId:
                type: string
                minLength: 1
              relationship:
                type: string
            required:
            - parentContactStrId
        commissionProfiles:
          type: array
          items:
            type: object
            properties:
              profileId:
                type: integer
              rate:
                type: number
              method:
                type: string
              startDate:
                type: string
              endDate:
                type: string
            required:
            - profileId
    AmsCreateContractSchema:
      type: object
      properties:
        companyId:
          type: string
          minLength: 1
        contractLevel:
          type: string
        licenseNumber:
          type: string
        status:
          $ref: '#/components/schemas/AmsContractStatusSchema'
        effectiveDate:
          type: string
        endDate:
          type: string
        notes:
          type: string
      required:
      - companyId
    AmsCreateCustomFieldDefinitionSchema:
      type: object
      properties:
        entityType:
          type: string
          minLength: 1
        fieldKey:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        dataType:
          type: string
          enum:
          - text
          - number
          - boolean
          - date
          - json
        isRequired:
          type: boolean
          default: false
        isSearchable:
          type: boolean
          default: false
        isFilterable:
          type: boolean
          default: false
        isReportable:
          type: boolean
          default: false
        validationRulesJson:
          type: string
          nullable: true
        defaultValue:
          type: string
          nullable: true
        enumOptionsJson:
          type: string
          nullable: true
        sortOrder:
          type: integer
          default: 0
      required:
      - entityType
      - fieldKey
      - displayName
      - dataType
      - isRequired
      - isSearchable
      - isFilterable
      - isReportable
      - sortOrder
    AmsCreateCustomerSchema:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        companyName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        dob:
          type: string
        gender:
          type: string
          enum:
          - male
          - female
          - other
        type:
          type: string
          enum:
          - individual
          - group
        status:
          type: string
        parentId:
          type: integer
        acquisitionChannel:
          type: string
        primaryAddressStrId:
          type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AmsCustomerAddressSchema'
        owners:
          type: array
          items:
            type: object
            properties:
              contactStrId:
                type: string
                minLength: 1
              relationshipType:
                type: string
                minLength: 1
            required:
            - contactStrId
            - relationshipType
    AmsCreateMyTaskSchema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        targetAudience:
          type: string
          enum:
          - agent
          - account
          - policy
          - customer
          - case
        targetId:
          type: string
          minLength: 1
        status:
          type: string
          default: pending
        assigneeUids:
          type: array
          items:
            type: string
            minLength: 1
        notes:
          type: string
        priority:
          type: string
          enum:
          - urgent
          - high
          - medium
          - low
          default: medium
        dueDate:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - document
          - general
          - missing_requirement
          - need_document
          - status_update
          - new_note
          default: general
      required:
      - title
      - targetAudience
      - targetId
      - status
      - priority
      - type
    AmsCreatePolicyDocumentSchema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        fileName:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
        fileSize:
          type: integer
          minimum: 0
        expiryDate:
          type: string
      required:
      - name
      - fileName
      - mimeType
