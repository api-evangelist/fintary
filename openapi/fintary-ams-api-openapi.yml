        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        agentCode:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
        uplines:
          type: array
          items:
            $ref: '#/components/schemas/AgentHierarchyNodeSchema'
        downlines:
          type: array
          items:
            $ref: '#/components/schemas/AgentHierarchyNodeSchema'
      required:
      - strId
      - firstName
      - lastName
      - name
      - email
      - agentCode
      - level
      - uplines
