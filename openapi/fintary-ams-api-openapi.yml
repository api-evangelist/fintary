      required:
      - strId
      - contactStrId
      - role
      - roleLabel
      - isPrimary
      - agentSplit
      - contact
    AmsWireDataSourceConfigSchema:
      type: object
      properties:
        listEndpoint:
          type: string
        listMethod:
          type: string
          enum:
          - get
          - post
        summaryEndpoint:
          type: string
        detailEndpoint:
          type: string
        statusConfigEndpoint:
          type: string
        filterOptionsEndpoint:
          type: string
        idField:
          type: string
      required:
      - listEndpoint
      - detailEndpoint
      - idField
    AmsWireSummaryConfigSchema:
      type: object
      properties:
        title:
          type: string
        cardsAreFilters:
          type: boolean
        cards:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              value:
                oneOf:
                - type: object
                  properties:
                    from:
                      type: string
                      enum:
                      - total
                  required:
                  - from
                - type: object
                  properties:
                    from:
                      type: string
                      enum:
                      - status
                    status:
                      type: string
                  required:
                  - from
                  - status
                - type: object
                  properties:
                    from:
                      type: string
                      enum:
                      - field
                    path:
                      type: string
                  required:
                  - from
                  - path
                - type: object
                  properties:
                    from:
                      type: string
                      enum:
                      - static
                    value:
                      anyOf:
                      - type: number
                      - type: string
                  required:
                  - from
                  - value
              caption:
                type: string
              accent:
                type: string
              filterValue:
                type: string
                nullable: true
            required:
            - key
            - label
            - value
          maxItems: 8
    AmsWireTableConfigSchema:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/AmsWireColumnConfigSchema'
          maxItems: 80
        defaultSort:
          type: object
          properties:
            field:
              type: string
            dir:
              type: string
              enum:
              - asc
              - desc
          required:
          - field
          - dir
        pageSize:
          type: number
        rowAction:
          type: string
          enum:
          - open-detail
      required:
      - columns
      - pageSize
    AmsWireColumnConfigSchema:
      type: object
      properties:
        field:
          type: string
        header:
          type: string
        width:
          type: number
        flex:
          type: number
        sortable:
          type: boolean
        align:
          type: string
          enum:
          - left
          - right
          - center
        cell:
          type: string
          enum:
          - text
          - currency
          - date
          - status
          - agentChip
          - chip
          - textBold
          - policyIdLink
        filter:
          $ref: '#/components/schemas/AmsWireFilterConfigSchema'
      required:
      - field
      - header
    AmsWireFilterConfigSchema:
      oneOf:
      - type: object
        properties:
          kind:
            type: string
            enum:
            - search
          field:
            type: string
        required:
        - kind
      - type: object
        properties:
          kind:
            type: string
            enum:
            - multiselect
          field:
            type: string
          optionsSource:
            type: string
            enum:
            - statusConfig
            - static
            - filterOptions
          staticOptions:
            type: array
            items:
              type: object
              properties:
                value:
                  type: string
                label:
                  type: string
              required:
              - value
              - label
        required:
        - kind
        - optionsSource
      - type: object
        properties:
          kind:
            type: string
            enum:
            - dateRange
          field:
            type: string
        required:
        - kind
      - type: object
        properties:
          kind:
            type: string
            enum:
            - numberRange
          field:
            type: string
        required:
        - kind
    AmsWireTabConfigSchema:
