    delete:
      summary: Delete policy document
      description: 'Removes the document from the Document Repository Service. Metadata is immutable in DRS, so there is no
        update route -- name and expiry are captured at upload.

        '
      tags:
      - AMS - Policies
      parameters:
      - name: strId
        in: path
        required: true
