      type: object
      properties:
        policyId:
          type: string
        policyStatus:
          type: string
        caseStatus:
          type: string
        customerId:
          type: integer
        productName:
          type: string
        productType:
          type: string
        productSubType:
          type: string
        productOptionName:
          type: string
        writingCarrierName:
          type: string
        effectiveDate:
          type: string
        expirationDate:
          type: string
        signedDate:
          type: string
        policyDate:
          type: string
        cancellationDate:
          type: string
        reinstatementDate:
          type: string
        firstPaymentDate:
          type: string
        firstProcessedDate:
          type: string
        premiumAmount:
          type: number
        commissionablePremiumAmount:
          type: number
        excessAmount:
          type: number
        commissionsExpected:
          type: number
