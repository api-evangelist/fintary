          nullable: true
        email:
          type: string
          nullable: true
          format: email
        phone:
          type: string
          nullable: true
        agentCode:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
        companyName:
