      - nickname
      - title
      - gender
      - birthday
      - phoneType
      - phone2
      - phone2Type
      - externalId
      - notes
      - payableStatus
      - payoutLevel
      - brokerCommPayTo
      - gaFieldRep
      - gaRepresentative
      - qbVendor
      - street
      - city
      - country
      - zip
      - createdAt
    AgentListResponseSchema:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentListItemSchema'
        pagination:
          $ref: '#/components/schemas/AmsPaginationSchema'
      required:
      - data
      - pagination
    AgentSummaryResponseSchema:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        writingAgents:
          type: integer
        salesReps:
          type: integer
      required:
      - total
      - active
      - writingAgents
      - salesReps
    AgentTreeNodeSchema:
      type: object
      properties:
        strId:
          type: string
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        agentCode:
          type: string
        level:
          type: string
        splitPercentage:
          type: number
        depth:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/AgentTreeNodeSchema'
        parentContactId:
          type: string
      required:
      - strId
      - depth
      - children
    AgentTreeResponseSchema:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/AgentTreeNodeSchema'
        ancestors:
          type: array
          items:
            $ref: '#/components/schemas/AgentTreeNodeSchema'
        descendants:
          type: array
          items:
            $ref: '#/components/schemas/AgentTreeNodeSchema'
      required:
      - ancestors
      - descendants
    AmsAgentContractPathParamsSchema:
      type: object
      properties:
        strId:
          type: string
          minLength: 1
        contractId:
          type: string
          minLength: 1
      required:
      - strId
      - contractId
    AmsAgentListQuerySchema:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        search:
          type: string
        sortBy:
          type: string
        sortOrder:
          type: string
          enum:
          - asc
          - desc
          default: desc
        status:
          type: string
        role:
          type: string
        email:
          type: string
        agentCode:
          type: string
        level:
          type: string
        createdFrom:
          type: string
        createdTo:
          type: string
      required:
      - page
      - pageSize
      - sortOrder
    AmsAgentPathParamsSchema:
      type: object
      properties:
        strId:
          type: string
          minLength: 1
      required:
      - strId
    AmsAgentTreeQuerySchema:
      type: object
      properties:
        strId:
          type: string
          minLength: 1
        effectiveDate:
          type: string
      required:
      - strId
    AmsBindableFieldSchema:
      allOf:
      - $ref: '#/components/schemas/AmsFilterFieldSchema'
      properties:
        source:
          type: string
          enum:
          - static
          - customField
      required:
      - source
    AmsBulkUpdateAgentDataSchema:
