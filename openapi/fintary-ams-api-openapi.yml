                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PolicyDocumentDetailSchema'
        '404':
          description: Not found
    post:
      summary: Start a policy document upload (phase 1 of two)
      description: 'Mints a short-lived signed PUT URL from the Document Repository Service. The client uploads the bytes
        straight to storage, then calls the finalize endpoint. The document is stamped with `metadata.policyId`.

        '
      tags:
      - AMS - Policies
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
