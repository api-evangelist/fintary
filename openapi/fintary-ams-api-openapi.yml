                    example: true
        '404':
          description: Not found
  /api/ams/policies/{strId}/documents/{documentStrId}/download:
    get:
      summary: Short-lived signed download URL for a policy document
      description: 'Returns a short-lived signed URL issued by the Document Repository Service. The document is resolved through
        its policy, so one belonging to another policy or account cannot be fetched.

        '
      tags:
      - AMS - Policies
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      - name: documentStrId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Signed download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                        nullable: true
        '404':
          description: Not found
  /api/ams/policies/{strId}/documents/finalize:
    post:
      summary: Finalize a policy document upload (phase 2 of two)
      description: 'Flips the Document Repository Service document to ACTIVE once the client has uploaded the bytes to the
        signed URL. Until this call lands the document is not returned by the list endpoint.

        '
      tags:
      - AMS - Policies
      parameters:
      - name: strId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmsFinalizePolicyDocumentSchema'
      responses:
        '200':
          description: Finalized
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PolicyDocumentDetailSchema'
        '404':
          description: Not found
