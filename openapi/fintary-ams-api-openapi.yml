openapi: 3.0.0
info:
  title: Fintary AMS API documentation
  version: '1.0'
tags:
- name: AMS - Policies
  description: Policy management endpoints
- name: AMS - Customers
  description: Customer management endpoints
- name: AMS - Agents
  description: Agent management endpoints
- name: AMS - Configs
  description: AMS configuration endpoints (statuses, roles)
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: string
  schemas:
    AgentDetailResponseSchema:
      type: object
      properties:
        strId:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        agentCode:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        geoState:
          type: string
          nullable: true
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
        userStrId:
          type: string
          nullable: true
        middleName:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        birthday:
          type: string
          nullable: true
        phoneType:
          type: string
          nullable: true
        phone2:
          type: string
          nullable: true
        phone2Type:
          type: string
          nullable: true
        externalId:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        payableStatus:
          type: string
          nullable: true
        payoutLevel:
          type: string
          nullable: true
        brokerCommPayTo:
          type: string
          nullable: true
        gaFieldRep:
          type: string
          nullable: true
        gaRepresentative:
          type: string
          nullable: true
        qbVendor:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        hierarchy:
          type: array
          items:
            type: object
            properties:
              parentContactStrId:
                type: string
              parentContactName:
                type: string
                nullable: true
              relationship:
                type: string
            required:
            - parentContactStrId
            - parentContactName
            - relationship
        policies:
          type: array
          items:
            type: object
            properties:
              strId:
                type: string
              policyId:
                type: string
                nullable: true
              policyStatus:
                type: string
                nullable: true
              customerName:
                type: string
                nullable: true
              role:
                type: string
              premiumAmount:
                type: string
                nullable: true
            required:
            - strId
            - policyId
            - policyStatus
            - customerName
            - role
            - premiumAmount
        customers:
          type: array
          items:
            type: object
            properties:
              strId:
                type: string
                nullable: true
              firstName:
                type: string
                nullable: true
              lastName:
                type: string
                nullable: true
              companyName:
                type: string
                nullable: true
              relationshipType:
                type: string
            required:
            - strId
            - firstName
            - lastName
            - companyName
            - relationshipType
        commissionProfiles:
          type: array
          items:
            type: object
            properties:
              strId:
                type: string
              profileName:
                type: string
                nullable: true
              rate:
                type: string
                nullable: true
              method:
                type: string
                nullable: true
            required:
            - strId
            - profileName
            - rate
            - method
        contracts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              companyId:
                type: string
              company:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                  companyName:
                    type: string
                    nullable: true
                  companyId:
                    type: string
                    nullable: true
                  email:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true
                  website:
                    type: string
                    nullable: true
                  address:
                    type: string
                    nullable: true
                required:
                - id
                - companyName
                - companyId
                - email
                - phone
                - website
                - address
              canonicalCompany:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                  companyName:
                    type: string
                    nullable: true
                  companyId:
                    type: string
                    nullable: true
                  email:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true
                  website:
                    type: string
                    nullable: true
                  address:
                    type: string
                    nullable: true
                required:
                - id
                - companyName
                - companyId
                - email
                - phone
                - website
                - address
              contractLevel:
                type: string
                nullable: true
              licenseNumber:
                type: string
                nullable: true
              status:
                type: string
                nullable: true
              effectiveDate:
                type: string
                nullable: true
            required:
            - id
            - companyId
            - contractLevel
            - licenseNumber
            - status
            - effectiveDate
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - strId
      - firstName
      - lastName
      - name
      - email
      - phone
      - agentCode
      - status
      - level
      - type
      - companyName
      - geoState
      - startDate
      - endDate
      - userStrId
      - middleName
      - nickname
      - title
      - gender
      - birthday
      - phoneType
      - phone2
      - phone2Type
      - externalId
      - notes
      - payableStatus
      - payoutLevel
      - brokerCommPayTo
      - gaFieldRep
      - gaRepresentative
      - qbVendor
      - street
      - city
      - country
      - zip
      - hierarchy
      - policies
      - customers
      - commissionProfiles
      - createdAt
      - updatedAt
    AgentHierarchyNodeSchema:
      type: object
      properties:
        strId:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        name:
          type: string
